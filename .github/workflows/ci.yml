name: CI
# L10.12 (2026-11-21): this used to run ruff / pytest / pip-audit with `|| true` or continue-on-error - steps that
# could never fail (a misleading green; standing order 6). The real gate is c2c-ci.yml (fresh ComfyUI boot with this
# pack, Windows + Ubuntu). Tests stay local (owner rule), so what is left here is the one check that can fail:
# the Comfy Registry metadata in pyproject.toml.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  registry-metadata:
    name: Registry metadata (pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pyproject.toml
        run: |
          python - <<'PY'
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          assert "project" in d, "missing [project]"
          p = d["project"]
          assert p.get("name"), "missing name"
          assert p.get("version"), "missing version"
          assert p.get("description"), "missing description"
          tc = d.get("tool", {}).get("comfy", {})
          assert tc.get("PublisherId"), "missing [tool.comfy].PublisherId"
          assert tc.get("DisplayName"), "missing [tool.comfy].DisplayName"
          print(f"OK: {p['name']} v{p['version']} (publisher={tc['PublisherId']})")
          PY
