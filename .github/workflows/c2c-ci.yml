# GENERATED by tools/sync_vendored.py from tools/vendored/c2c-ci.yml.tmpl - edit the template, not this file.
# C2C CI (ORDERS Phase 0 step 5, ledger L0.06): boot + registration check of the pack on Windows AND Ubuntu,
# CPU only. Test suites stay on the developer's machine (owner rule 2026-10-23: "never git push test folders at
# all. keep them in local only"), so CI boots a fresh ComfyUI with only this pack and fails on an import failure,
# zero registered nodes or a traceback from the pack (.github/c2c_boot_check.py). The checkout mirrors the owner's
# layout (Custom_Nodes/<pack> beside ComfyUI_windows_portable/ComfyUI).
name: C2C CI
on:
  push:
    branches: [main, master, "c2c/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: c2c-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACK: "ComfyUI-CustomNodePacks"
  COMFY_TAG: "v0.36.0"
  FRONTEND_VERSION: "1.52.7"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: Custom_Nodes/${{ env.PACK }}

      - name: Checkout ComfyUI core ${{ env.COMFY_TAG }}
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ env.COMFY_TAG }}
          path: ComfyUI_windows_portable/ComfyUI

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU torch, core, pinned frontend, pack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI_windows_portable/ComfyUI/requirements.txt
          pip install "comfyui-frontend-package==${FRONTEND_VERSION}"
          if [ -f "Custom_Nodes/$PACK/requirements.txt" ]; then pip install -r "Custom_Nodes/$PACK/requirements.txt"; fi
          echo "COMFYUI_PATH=$GITHUB_WORKSPACE/ComfyUI_windows_portable/ComfyUI" >> "$GITHUB_ENV"
          echo "C2C_COMFY_CORE=$GITHUB_WORKSPACE/ComfyUI_windows_portable/ComfyUI" >> "$GITHUB_ENV"

      - name: Boot + registration check
        run: python "Custom_Nodes/$PACK/.github/c2c_boot_check.py" --core ComfyUI_windows_portable/ComfyUI --out ci-artifacts

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.os }}
          path: ci-artifacts
          retention-days: 14
