[project]
# Comfy Registry node id. PUBLISHED as "comfyui-customnodepacks" (registry ids are immutable and unique
# case-insensitively), so registry / ComfyUI-Manager installs land in custom_nodes/comfyui-customnodepacks while a
# git clone lands in custom_nodes/ComfyUI-CustomNodePacks (README "Folder name"). Do not change it.
name = "comfyui-customnodepacks"
description = "Code2Collapse's core ComfyUI pack: mask editing and segmentation (MaskEditControl, Image Mask Editor, SAM 1/2/3, matting, mask placement), C2C Vault protected subgraphs, Folder Incrementer versioned output, C2C video load/save, render farm and multi-GPU split, Magnific API nodes, frequency/grain, tiled refinement, layer effects and model analysis."
version = "2.0.2"
license = { file = "LICENSE" }
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Code2Collapse" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
# torch / torchvision come with ComfyUI and are NOT listed: an installer resolving them could replace the
# CUDA build ComfyUI runs on (A24 dependency audit, 2026-11-07).
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "transformers>=4.40",
    "diffusers>=0.27",
    "accelerate",
    "matplotlib",
    "httpx>=0.27",
    "keyring>=24.0",
]

[project.optional-dependencies]
ai-cloud = ["anthropic>=0.34", "openai>=1.40"]
ai-local = []  # llama.cpp or Ollama is installed system-wide; no Python deps required

[project.urls]
Repository = "https://github.com/Code2Collapse/ComfyUI-CustomNodePacks"
Documentation = "https://github.com/Code2Collapse/ComfyUI-CustomNodePacks#readme"
Issues = "https://github.com/Code2Collapse/ComfyUI-CustomNodePacks/issues"

[tool.pytest.ini_options]
markers = [
    "slow: long-running memory torture test",
]

[tool.comfy]
PublisherId = "code2collapse"
DisplayName = "ComfyUI-CustomNodePacks"
Icon = "https://i.pinimg.com/736x/5d/52/19/5d5219ef27c1530bea027ff95d352e05.jpg"
